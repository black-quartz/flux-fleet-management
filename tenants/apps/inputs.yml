- name: arc-runners
  namespace: arc-runners
  podSecurityEnforce: baseline
  repository:
    url: https://github.com/black-quartz/actions-runner-scale-set-deployment
    ref:
      branch: main
    path: ./kubernetes/${ENVIRONMENT}

- name: vault
  namespace: vault
  podSecurityEnforce: baseline
  repository:
    url: https://github.com/black-quartz/vault-deployment
    ref:
      branch: main
    path: ./kubernetes/${ENVIRONMENT}

- name: vector
  namespace: vector
  podSecurityEnforce: privileged
  repository:
    url: https://github.com/black-quartz/vector-deployment
    ref:
      branch: main
    path: ./kubernetes/${ENVIRONMENT}

- name: elastic-stack
  namespace: elastic-stack
  podSecurityEnforce: baseline
  repository:
    url: https://github.com/black-quartz/elastic-stack-deployment
    ref:
      branch: main
    path: ./kubernetes/${ENVIRONMENT}

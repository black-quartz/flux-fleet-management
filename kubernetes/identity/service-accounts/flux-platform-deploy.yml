apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-platform-deploy
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-platform-deploy-binding
subjects:
  - kind: ServiceAccount
    name: flux-platform-deploy
    namespace: flux-system
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io

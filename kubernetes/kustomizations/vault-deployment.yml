apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vault-deployment
  namespace: flux-system
spec:
  serviceAccountName: flux-platform-reconciler
  targetNamespace: vault
  sourceRef:
    kind: GitRepository
    name: vault-deployment
  path: kubernetes
  interval: 10m
  prune: true
  dependsOn:
    - name: platform-network-policies
    - name: platform-identity

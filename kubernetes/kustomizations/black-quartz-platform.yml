apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-namespaces
  namespace: flux-system
spec:
  serviceAccountName: flux-platform-reconciler
  sourceRef:
    kind: GitRepository
    name: black-quartz-platform
  path: kubernetes/namespaces
  interval: 10m
  prune: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-identity
  namespace: flux-system
spec:
  serviceAccountName: flux-platform-reconciler
  sourceRef:
    kind: GitRepository
    name: black-quartz-platform
  path: kubernetes/identity
  interval: 10m
  prune: true
  dependsOn:
    - name: platform-namespaces

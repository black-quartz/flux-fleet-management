apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  serviceAccountName: cert-manager-deploy
  targetNamespace: cert-manager
  sourceRef:
    kind: GitRepository
    name: cert-manager-deployment
  path: kubernetes
  interval: 10m
  prune: true
  dependsOn:
    - name: platform-identity
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-config
  namespace: cert-manager
spec:
  serviceAccountName: cert-manager-deploy
  targetNamespace: cert-manager
  sourceRef:
    kind: GitRepository
    name: cert-manager-deployment
  path: kubernetes/config
  interval: 10m
  prune: true
  dependsOn:
    - name: cert-manager

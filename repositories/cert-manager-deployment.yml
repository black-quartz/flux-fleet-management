apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: cert-manager-deployment
  namespace: flux-system
spec:
  interval: 1m
  provider: github
  url: https://github.com/black-quartz/cert-manager-deployment.git
  ref:
    branch: main
  secretRef:
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-deployment
  namespace: flux-system
spec:
  serviceAccountName: flux-deploy
  interval: 10m
  path: deploy
  prune: true
  sourceRef:
    kind: GitRepository
    name: cert-manager-deployment
  wait: true

apiVersion: v1
kind: ConfigMap
metadata:
  name: flux-allowlist
  namespace: flux-system
  labels:
    fluxcd.controlplane.io/role: "policy"
data:
  sources: >-
    https://github.com/ilysiumdotdev/actions-runner-scale-set-deployment
    https://github.com/ilysiumdotdev/elastic-stack-deployment
    https://github.com/ilysiumdotdev/minecraft-server-infrastructure
    https://github.com/ilysiumdotdev/twingate-connector-deployment
    https://github.com/ilysiumdotdev/vault-deployment
    https://github.com/ilysiumdotdev/vector-deployment
    https://github.com/controlplaneio-fluxcd/
    https://helm.releases.hashicorp.com/
    https://helm.vector.dev
    https://twingate.github.io/helm-charts/
    oci://ghcr.io/actions/actions-runner-controller-charts
    oci://ghcr.io/controlplaneio-fluxcd/
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: flux-tenant-sources
spec:
  policyName: "source.policy.fluxcd.controlplane.io"
  validationActions: ["Deny"]
  paramRef:
    name: flux-allowlist
    namespace: flux-system
    parameterNotFoundAction: "Deny"
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: toolkit.fluxcd.io/role
          operator: In
          values:
            - tenant

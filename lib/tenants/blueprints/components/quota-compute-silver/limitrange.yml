apiVersion: v1
kind: LimitRange
metadata:
  name: compute-limits
spec:
  limits:
    - type: Container
      default:
        cpu: "200m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "256Mi"
      max:
        cpu: "500m"
        memory: "2Gi"
      min:
        cpu: "10m"
        memory: "32Mi"

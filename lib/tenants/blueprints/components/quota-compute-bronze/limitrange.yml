apiVersion: v1
kind: LimitRange
metadata:
  name: compute-limits
spec:
  limits:
    - type: Container
      default:
        cpu: "100m"
        memory: "256Mi"
      defaultRequest:
        cpu: "50m"
        memory: "128Mi"
      max:
        cpu: "250m"
        memory: "512Mi"
      min:
        cpu: "10m"
        memory: "32Mi"

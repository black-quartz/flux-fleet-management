apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux
  namespace: << inputs.namespace >>
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux
  namespace: << inputs.namespace >>
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: flux
    namespace: << inputs.namespace >>

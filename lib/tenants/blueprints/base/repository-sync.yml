apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: << inputs.name >>
  namespace: << inputs.namespace >>
spec:
  interval: 5m
  provider: github
  url: << inputs.repository.url >>
  ref:
    branch: << inputs.repository.ref.branch >>
  secretRef:
    name: github-auth
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: << inputs.name >>
  namespace: << inputs.namespace >>
spec:
  targetNamespace: << inputs.namespace >>
  serviceAccountName: flux
  interval: 30m
  retryInterval: 5m
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: << inputs.name >>
  path: << inputs.repository.path >>
  prune: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: flux-runtime-info
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: github-provider
  namespace: << inputs.namespace >>
spec:
  type: github
  address: << inputs.repository.url >>
  secretRef:
    name: github-auth
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: github-commit-status
  namespace: << inputs.namespace >>
spec:
  providerRef:
    name: github-provider
  eventSeverity: info
  eventSources:
    - kind: Kustomization
      name: << inputs.name >>

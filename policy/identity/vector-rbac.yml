apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector-agent
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector-agent-binding
subjects:
  - kind: ServiceAccount
    name: vector-agent
    namespace: vector
roleRef:
  kind: ClusterRole
  name: vector-agent
  apiGroup: rbac.authorization.k8s.io

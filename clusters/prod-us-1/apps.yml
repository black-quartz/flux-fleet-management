apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: components
  path: ./clusters/prod-us-1/apps
  interval: 5m
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-fleet-management
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: flux-runtime-info

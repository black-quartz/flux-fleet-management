apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: components
  namespace: flux-system
spec:
  wait: true
  dependsOn:
    - name: policy
    - name: rbac
  path: ./components
  interval: 5m
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-fleet-management
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: flux-runtime-info

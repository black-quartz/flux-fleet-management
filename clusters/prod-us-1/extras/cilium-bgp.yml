apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: cilium-bgp
  namespace: flux-system
spec:
  resources:
    - apiVersion: cilium.io/v2
      kind: CiliumBGPClusterConfig
      metadata:
        name: cluster-bgp
      spec:
        nodeSelector:
          matchLabels:
            node-role.kubernetes.io/control-plane: ""
        bgpInstances:
          - name: instance-65000
            localASN: 65000
            peers:
              - name: unifi-gateway
                peerASN: 65100
                peerAddress: 10.20.20.1
                peerConfigRef:
                  name: unifi-gateway-peer-config

    - apiVersion: cilium.io/v2
      kind: CiliumBGPPeerConfig
      metadata:
        name: unifi-gateway-peer-config
      spec:
        gracefulRestart:
          enabled: true
        families:
          - afi: ipv4
            safi: unicast
            advertisements:
              matchLabels:
                bgp.cilium.io/advertise: loadbalancer-services

    - apiVersion: cilium.io/v2
      kind: CiliumBGPAdvertisement
      metadata:
        name: bgp-advertisements
        labels:
          bgp.cilium.io/advertise: loadbalancer-services
      spec:
        advertisements:
          - advertisementType: "Service"
            service:
              addresses:
                - LoadBalancerIP
            selector:
              matchLabels: {}

    - apiVersion: cilium.io/v2
      kind: CiliumLoadBalancerIPPool
      metadata:
        name: internal-gw-lb-pool
      spec:
        blocks:
          - cidr: 10.20.40.0/28
        serviceSelector:
          matchLabels:
            networking.ilysium.io/lb-pool: internal

    - apiVersion: cilium.io/v2
      kind: CiliumLoadBalancerIPPool
      metadata:
        name: perimeter-gw-lb-pool
      spec:
        blocks:
          - cidr: 10.20.60.0/28
        serviceSelector:
          matchLabels:
            networking.ilysium.io/lb-pool: perimeter
